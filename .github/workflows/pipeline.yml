name: CI - HTML e CSS
on:
  push:
    branches:
      - main
      - desenvolvimento
  pull_request:
    branches:
      - main
      - desenvolvimento

jobs:
  validate:
    name: Validar projeto
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar ferramentas de validação
        run: |
          npm install -g html-validate stylelint stylelint-config-standard

      - name: Confirmar HTML
        run: |
          html-validate "**/*.html"

      - name: Confirmar CSS
        run: |
          stylelint "**/*.css"

      - name: Testes concluídos
        run: echo "HTML e CSS validados com sucesso!"
