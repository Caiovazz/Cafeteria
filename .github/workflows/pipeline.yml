name: CI - HTML e CSS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Confirma HTML e CSS
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar ferramentas de validação
        run: |
          npm install --global html-validate stylelint stylelint-config-standard

      - name: Confirma HTML
        run: |
          html-validate "**/*.html"

      - name: Criar configuração do CSS
        run: |
          cat > .stylelintrc.json <<'EOF'
          {
            "extends": ["stylelint-config-standard"]
          }
          EOF

      - name: Confirma CSS
        run: |
          stylelint "**/*.css"

      - name: Testes concluídos
        run: echo "Validação HTML e CSS concluída com sucesso!"
